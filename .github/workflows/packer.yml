name: packer

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "src/E33Packer.App/**"
      - "src/E33Packer.Tests/**"
      - "src/E33ModEditor.Core/**"
      - "src/UAssetAPI/**"
      - "src/CUE4Parse/**"
      - "tools/Mappings.usmap"
      - "tools/MappingsLegacy.usmap"
      - "tools/repak/**"
      - ".github/workflows/packer.yml"
  pull_request:
    paths:
      - "src/E33Packer.App/**"
      - "src/E33Packer.Tests/**"
      - "src/E33ModEditor.Core/**"
      - ".github/workflows/packer.yml"
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CUE4PARSE_SKIP_NATIVE: "true"
  RETOC_VERSION: v0.1.5

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test generator presets and option mapping
        run: dotnet test src/E33Packer.Tests/E33Packer.Tests.csproj -c Release --nologo
      - name: Fetch retoc (linux x64 release)
        run: |
          set -euo pipefail
          mkdir -p src/E33Packer.App/tools
          retoc_dir="$RUNNER_TEMP/retoc"
          mkdir -p "$retoc_dir"
          curl -fsSL -o "$retoc_dir/retoc.tar.xz" \
            "https://github.com/trumank/retoc/releases/download/${RETOC_VERSION}/retoc_cli-x86_64-unknown-linux-gnu.tar.xz"
          tar -xJf "$retoc_dir/retoc.tar.xz" -C "$retoc_dir"
          find "$retoc_dir" -type f \( -name retoc -o -name 'liboo2corelinux64.so*' \) \
            -exec cp {} src/E33Packer.App/tools/ \;
          chmod +x src/E33Packer.App/tools/retoc
          test -x src/E33Packer.App/tools/retoc
          ls -lh src/E33Packer.App/tools
      - name: Publish linux-x64
        run: |
          dotnet publish src/E33Packer.App/E33Packer.App.csproj -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:PublishTrimmed=false \
            -o dist/linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ExpeditionInfinity-linux-x64
          path: dist/linux-x64/ExpeditionInfinity
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Fetch retoc (windows x64 release)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/E33Packer.App/tools | Out-Null
          $zip = Join-Path $env:TEMP "retoc.zip"
          Invoke-WebRequest -UseBasicParsing -OutFile $zip `
            "https://github.com/trumank/retoc/releases/download/$env:RETOC_VERSION/retoc_cli-x86_64-pc-windows-msvc.zip"
          Expand-Archive -Force -Path $zip -DestinationPath (Join-Path $env:TEMP "retoc")
          Get-ChildItem -Recurse (Join-Path $env:TEMP "retoc") -File |
            Copy-Item -Destination src/E33Packer.App/tools -Force
          Get-ChildItem src/E33Packer.App/tools
      - name: Publish win-x64
        run: |
          dotnet publish src/E33Packer.App/E33Packer.App.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:PublishTrimmed=false `
            -o dist/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ExpeditionInfinity-win-x64
          path: dist/win-x64/ExpeditionInfinity.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ExpeditionInfinity-linux-x64/ExpeditionInfinity
            ExpeditionInfinity-win-x64/ExpeditionInfinity.exe
